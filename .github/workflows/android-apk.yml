name: Android 테스트용 APK 만들기

# Actions 탭에서 "Run workflow" 를 누르거나, 게임 파일이 바뀌면 자동으로 실행됩니다.
# 결과 APK는 실행 기록 아래 Artifacts 에서 내려받아 안드로이드 폰에 설치해 테스트합니다.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - 'package.json'
      - 'capacitor.config.json'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - name: Android 프로젝트 준비
        run: |
          [ -d android ] || npx cap add android
          npx cap sync android
      - name: APK 빌드
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ttangtta-rush-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
