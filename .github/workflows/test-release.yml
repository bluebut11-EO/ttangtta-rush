name: TEST release signing (throwaway key)

# Actions 탭 > 이 작업 > "Run workflow" 를 눌렀을 때만 실행됩니다.
# 먼저 setup-release-key.sh 로 서명 키를 만들고 GitHub Secrets 에 등록해야 합니다.
# 결과 AAB는 실행 기록 아래 Artifacts 에서 내려받아 Play Console 에 올립니다.
on:
  push:
    branches: [ci-release-test]

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 테스트용 임시 키 만들기
        run: |
          keytool -genkeypair -keystore t.jks -storetype PKCS12 -alias upload -keyalg RSA -keysize 2048 -validity 1 -storepass testpass123 -keypass testpass123 -dname CN=test
          { echo "KEYSTORE_BASE64=$(base64 -w0 t.jks)"; echo KEYSTORE_PASSWORD=testpass123; echo KEY_ALIAS=upload; echo KEY_PASSWORD=testpass123; } >> "$GITHUB_ENV"
      - name: 서명 키 확인
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::서명 키가 없습니다. PC에서 'bash setup-release-key.sh' 를 먼저 실행하세요."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - name: Android 프로젝트 준비
        run: |
          [ -d android ] || npx cap add android
          npx cap sync android
      - name: 버전 번호 넣기
        run: |
          VERSION_NAME=$(node -p "require('./package.json').version")
          VERSION_CODE=${{ github.run_number }}
          sed -i -E "s/versionCode [0-9]+/versionCode ${VERSION_CODE}/; s/versionName \"[^\"]*\"/versionName \"${VERSION_NAME}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle
          echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${VERSION_CODE}" >> "$GITHUB_ENV"
      - name: 서명된 AAB 빌드
        working-directory: android
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/upload.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          rm -f "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: ttangtta-rush-v${{ env.VERSION_NAME }}-${{ env.VERSION_CODE }}-aab
          path: android/app/build/outputs/bundle/release/*.aab
      - name: 서명 확인
        run: |
          AAB=$(ls android/app/build/outputs/bundle/release/*.aab)
          ls -la "$AAB"
          jarsigner -verify -verbose:summary "$AAB" | tail -3
          unzip -p "$AAB" base/manifest/AndroidManifest.xml | strings | grep -i -m3 "bluebut11" || true
